{% extends 'base.html' %}

{% block title %}Finalizar Chamado #{{ ticket.numero }}{% endblock %}

{% block content %}
<div class="page-container">
    
    <div class="form-card-container">
        
        <header class="page-header">
            <h1 class="page-title">Finalizar Chamado #{{ ticket.numero }}</h1>
            <p class="page-subtitle">{{ ticket.titulo }} — {{ ticket.sala }}</p>
        </header>

        <form action="{{ url_for('chamados.finalizar', ticket_id=ticket.id) }}" method="POST" class="ticket-form" novalidate>
            
            <!-- Campo Ação Tomada / Solução -->
            <div class="form-group">
                <label for="solucao" class="form-label">O que foi utilizado para resolver? <span class="required-star">*</span></label>
                <input 
                    type="text" 
                    id="solucao" 
                    name="solucao" 
                    class="form-control" 
                    placeholder="Ex: Substituição de fonte, cabos, atualização de driver..." 
                    value="{{ form_data.solucao if form_data else '' }}" 
                    required
                >
            </div>

            <!-- Campo Tempo Necessário -->
            <div class="form-group">
                <label for="tempo_minutos" class="form-label">Tempo necessário (em minutos) <span class="required-star">*</span></label>
                <input 
                    type="number" 
                    id="tempo_minutos" 
                    name="tempo_minutos" 
                    class="form-control" 
                    placeholder="Ex: 45" 
                    min="1" 
                    max="1440" 
                    value="{{ form_data.tempo_minutos if form_data else '' }}" 
                    required
                >
            </div>

            <!-- Campo Categoria -->
            <div class="form-group">
                <label for="categoria" class="form-label">Categoria <span class="required-star">*</span></label>
                <div class="select-wrapper">
                    <select id="categoria" name="categoria" class="form-control form-select" required>
                        <option value="" disabled selected>Selecione uma categoria</option>
                        {% for cat in categories %}
                            <option value="{{ cat }}" {% if form_data and form_data.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                    <span class="select-chevron" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </span>
                </div>
            </div>

            <!-- Campo Status de Conclusão -->
            <div class="form-group">
                <label class="form-label">Status de conclusão <span class="required-star">*</span></label>
                <div class="status-radio-group">
                    <label class="radio-badge-card radio-status-resolvido">
                        <input type="radio" name="status_conclusao" value="Resolvido" checked onchange="togglePendingField(false)">
                        <span class="radio-indicator"></span>
                        <span class="radio-text">Resolvido</span>
                    </label>

                    <label class="radio-badge-card radio-status-pendente">
                        <input type="radio" name="status_conclusao" value="Pendente" onchange="togglePendingField(true)">
                        <span class="radio-indicator"></span>
                        <span class="radio-text">Pendente</span>
                    </label>
                </div>
            </div>

            <!-- Campo Motivo (Aparece condicionalmente se Pendente) -->
            <div class="form-group" id="motivoPendenteGroup" style="display: none;">
                <label for="motivo_pendente" class="form-label">Motivo (se pendente) <span class="required-star">*</span></label>
                <textarea 
                    id="motivo_pendente" 
                    name="motivo_pendente" 
                    class="form-control form-textarea" 
                    rows="3" 
                    placeholder="Descreva o motivo (ex: aguardando substituição de peça pelo fornecedor)..."
                >{{ form_data.motivo_pendente if form_data else '' }}</textarea>
            </div>

            <!-- Botões de Ação -->
            <div class="form-buttons-row">
                <a href="{{ url_for('chamados.detalhe', ticket_id=ticket.id) }}" class="btn btn-outline btn-lg">
                    Cancelar
                </a>
                <button type="submit" class="btn btn-primary btn-lg" id="btnFinishTicket">
                    Concluir
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}
