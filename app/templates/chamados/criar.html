{% extends 'base.html' %}

{% block title %}Criar Chamado{% endblock %}

{% block content %}
<div class="page-container">
    
    <div class="form-card-container">
        <header class="page-header">
            <h1 class="page-title">Criar Chamado</h1>
            <p class="page-subtitle">Descreva o problema para que possamos te ajudar.</p>
        </header>

        <form action="{{ url_for('chamados.criar') }}" method="POST" class="ticket-form" novalidate>
            <!-- Campo Nome -->
            <div class="form-group">
                <label for="nome" class="form-label">Nome <span class="required-star">*</span></label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome" 
                    class="form-control" 
                    placeholder="Seu nome completo" 
                    value="{{ form_data.nome if form_data else logged_user.nome }}" 
                    required
                >
            </div>

            <!-- Campo Descrição do Problema -->
            <div class="form-group">
                <label for="descricao" class="form-label">Descrição do problema <span class="required-star">*</span></label>
                <textarea 
                    id="descricao" 
                    name="descricao" 
                    class="form-control form-textarea" 
                    rows="5" 
                    placeholder="Descreva o que aconteceu..." 
                    required
                >{{ form_data.descricao if form_data else '' }}</textarea>
                <span class="field-hint">Seja o mais específico possível (ex: cabos soltos, mensagens de erro, etc.).</span>
            </div>

            <!-- Seleção de Ambiente em Duas Etapas: Tipo e Sala Específica -->
            <div class="form-row-2">
                <!-- 1. Tipo de Ambiente -->
                <div class="form-group">
                    <label for="tipo_sala" class="form-label">Tipo de Ambiente <span class="required-star">*</span></label>
                    <div class="select-wrapper">
                        <select id="tipo_sala" class="form-control form-select" required onchange="atualizarSalasPorTipo(this.value)">
                            <option value="" disabled selected>Selecione o tipo de espaço</option>
                            <option value="sala_aula">Salas de Aula (1 a 15)</option>
                            <option value="lab_maker">Laboratórios / Maker</option>
                            <option value="administrativo">Administrativo (Secretaria)</option>
                        </select>
                        <span class="select-chevron" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </span>
                    </div>
                </div>

                <!-- 2. Sala / Espaço Específico -->
                <div class="form-group">
                    <label for="sala" class="form-label">Sala / Espaço <span class="required-star">*</span></label>
                    <div class="select-wrapper">
                        <select id="sala" name="sala" class="form-control form-select" required>
                            <option value="" disabled selected>Primeiro selecione o tipo</option>
                        </select>
                        <span class="select-chevron" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Campo Máquina (Opcional) -->
            <div class="form-group">
                <label for="maquina" class="form-label">Identificação do Equipamento / Máquina <span class="optional-tag">(opcional)</span></label>
                <input 
                    type="text" 
                    id="maquina" 
                    name="maquina" 
                    class="form-control" 
                    placeholder="Ex: PC 04, Projetor Epson, Monitor 02..." 
                    value="{{ form_data.maquina if form_data else '' }}"
                >
            </div>

            <!-- Botão de Envio com Azul Escuro Institucional -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-submit-ticket" id="btnSubmitTicket">
                    <span class="btn-text">Enviar Chamado</span>
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const roomCategoriesData = {{ room_categories | tojson }};

    function atualizarSalasPorTipo(tipo, selectedSala = null) {
        const salaSelect = document.getElementById('sala');
        salaSelect.innerHTML = '';
        
        if (!tipo || !roomCategoriesData[tipo]) {
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.disabled = true;
            defaultOpt.selected = true;
            defaultOpt.textContent = 'Primeiro selecione o tipo';
            salaSelect.appendChild(defaultOpt);
            return;
        }

        const salas = roomCategoriesData[tipo].salas;
        const placeholderOpt = document.createElement('option');
        placeholderOpt.value = '';
        placeholderOpt.disabled = true;
        placeholderOpt.selected = !selectedSala;
        placeholderOpt.textContent = 'Selecione a sala';
        salaSelect.appendChild(placeholderOpt);

        salas.forEach(sala => {
            const opt = document.createElement('option');
            opt.value = sala;
            opt.textContent = sala;
            if (selectedSala && selectedSala === sala) {
                opt.selected = true;
            }
            salaSelect.appendChild(opt);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const prevSala = "{{ form_data.sala if form_data else '' }}";
        if (prevSala) {
            for (const [key, cat] of Object.entries(roomCategoriesData)) {
                if (cat.salas.includes(prevSala)) {
                    document.getElementById('tipo_sala').value = key;
                    atualizarSalasPorTipo(key, prevSala);
                    break;
                }
            }
        }
    });
</script>
{% endblock %}
